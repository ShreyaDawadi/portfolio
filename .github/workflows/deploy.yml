name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Plain HTML/CSS/JS: no build step, publish the files as they are.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js favicon.svg og.png portrait.jpg Shreya_Dawadi_Resume.pdf CNAME sitemap.xml robots.txt _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
